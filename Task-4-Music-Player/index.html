<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player | CodeAlpha Task 4</title>
  <meta name="description" content="A responsive music player built with HTML, CSS and vanilla JavaScript.">
  <meta name="theme-color" content="#0a0c14">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%238b7cff'/%3E%3Cpath d='M36 14v21.1a8 8 0 1 0 4 6.9V22h8v-8z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Music Player</h1>
    </header>

    <section class="player-card" aria-label="Music player">

      <!-- ================= NOW PLAYING ================= -->
      <div class="now-playing">
        <div class="artwork" id="artwork">
          <img id="cover" alt="" hidden>
          <svg class="artwork-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>

        <div class="track-info">
          <h2 class="track-title" id="track-title">Loading&hellip;</h2>
          <p class="track-artist" id="track-artist"></p>
        </div>

        <div class="progress-area">
          <input class="range" id="progress" type="range" min="0" max="10000" step="1" value="0"
                 disabled aria-label="Seek position">
          <div class="time-row">
            <span id="current-time">0:00</span>
            <span id="duration">--:--</span>
          </div>
        </div>

        <div class="controls">
          <button class="ctrl ctrl-small" id="shuffle-btn" type="button" aria-label="Shuffle" aria-pressed="false" title="Shuffle: off">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          </button>

          <button class="ctrl" id="prev-btn" type="button" aria-label="Previous song">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>

          <button class="ctrl play-btn" id="play-btn" type="button" aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>

          <button class="ctrl" id="next-btn" type="button" aria-label="Next song">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>

          <button class="ctrl ctrl-small repeat-btn" id="repeat-btn" type="button" aria-label="Repeat: off" title="Repeat: off" data-mode="off">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <span class="badge" aria-hidden="true">1</span>
          </button>
        </div>

        <div class="volume-row">
          <button class="ctrl ctrl-small mute-btn" id="mute-btn" type="button" aria-label="Mute" data-level="high">
            <svg class="icon-vol-high" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg class="icon-vol-low" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
            <svg class="icon-vol-muted" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <input class="range volume-slider" id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
        </div>

        <p class="message" id="message" role="status" aria-live="polite"></p>
      </div>

      <!-- ================= PLAYLIST ================= -->
      <aside class="playlist-panel" aria-labelledby="playlist-title">
        <div class="playlist-head">
          <h2 id="playlist-title">Playlist</h2>
          <span class="playlist-count" id="playlist-count"></span>
        </div>
        <ul class="playlist" id="playlist"></ul>
        <p class="playlist-hint">
          Songs play from the <code>songs</code> folder. Add your own MP3 files with the filenames listed in <code>script.js</code>.
        </p>
      </aside>

    </section>
  </main>

  <audio id="audio" preload="metadata"></audio>

  <script src="script.js"></script>
</body>
</html>
